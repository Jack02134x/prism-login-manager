# PLM: the sway that runs the login screen (as the greeter user), for machines
# without Hyprland. plm-session starts it with `sway -c` this file.
# Machine-specific outputs/inputs: /etc/plm/sway.conf (included when it exists).

default_border none
default_floating_border none
focus_follows_mouse no
input type:keyboard {
    xkb_layout $PLM_KB_LAYOUT
}
include /etc/plm/sway.conf
exec "quickshell -p $PLM_SHARE/shell; swaymsg exit"
